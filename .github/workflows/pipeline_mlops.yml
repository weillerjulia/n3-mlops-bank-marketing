name: pipeline-mlops

# Workflow ÚNICO do projeto: um ciclo completo por execução, em sequência.
on:
  schedule:
    # Todo dia às 11:17 UTC (08:17 em Brasília). Minuto "quebrado" para fugir
    # do pico de agendamentos na hora cheia, que costuma atrasar no GitHub.
    - cron: "17 11 * * *"
  workflow_dispatch: # execução manual, apenas para depuração

permissions:
  contents: write # necessário para salvar o estado do ciclo no repositório

# Nunca rodar dois ciclos ao mesmo tempo (o estado é sequencial)
concurrency:
  group: pipeline-mlops
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (inclui estado persistente do ciclo anterior)
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar pipeline 01 -> 05
        id: pipeline
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: bash executar_pipeline.sh

      # Só chega aqui se TODOS os notebooks rodaram sem erro.
      # Uma falha interrompe o job antes deste passo: nada é salvo e o
      # modelo vigente anterior continua valendo (sem promoção indevida).
      - name: Salvar estado persistente no repositório
        run: |
          git config user.name "pipeline-mlops[bot]"
          git config user.email "pipeline-mlops[bot]@users.noreply.github.com"
          git add data/raw data/state/lotes_ingeridos.json models mlflow.db mlartifacts evidencias
          git commit -m "ciclo ${{ steps.pipeline.outputs.cycle_id }} (${{ github.event_name }}) [skip ci]" || echo "Nada para salvar"
          git pull --rebase
          git push

      - name: Publicar pacote do ciclo (artifact baixável)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-${{ steps.pipeline.outputs.cycle_id || github.run_id }}
          path: |
            mlflow.db
            mlartifacts/
            models/
            evidencias/
            data/state/
          retention-days: 90
